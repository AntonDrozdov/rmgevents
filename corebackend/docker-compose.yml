version: '3.9'

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: backendtemplate-webapi:latest
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=sereq;Username=postgres;Password=admin
      - Jwt__Key=local-development-key-change-in-production-2026
      - Jwt__Issuer=ServerEquipment
      - Jwt__Audience=ServerEquipment.Admin
      - Admin__Username=admin
      - Admin__Password=admin
