name: rmgevents

services:
  corebackend:
    image: rmgevents-corebackend:latest
    container_name: rmgevents-corebackend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rmgevents;Username=postgres;Password=Tgbyhn123
      Jwt__Key: local-development-key-change-in-production-2026
      Jwt__Issuer: EA
      Jwt__Audience: EA.Admin
      Jwt__SidKey: local-development-sid-encryption-key-change-in-production-2026
    ports:
      - "6345:8080"
    networks:
      - rmgevents-network
      - danetwork
    restart: unless-stopped

  frontend:
    image: rmgevents-frontend:latest
    container_name: rmgevents-frontend
    depends_on:
      - corebackend
    ports:
      - "1345:8080"
    networks:
      - rmgevents-network
    restart: unless-stopped

networks:
  rmgevents-network:
    name: rmgevents-network
    driver: bridge
  danetwork:
    name: danetwork
    external: true
